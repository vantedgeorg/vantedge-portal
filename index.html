<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vantedge Member Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#07081a;
    --surface:#0c0e1e;
    --raise:#11142a;
    --hover:#161a33;
    --line:#1e2238;
    --line-2:#2a2f4a;
    --text:#f3f1ea;
    --muted:#9a9db2;
    --dim:#686c86;
    --cream:#dfdcc9;
    --cream-2:#ede9e0;
    --ok:#94c2a3; --ok-bg:rgba(148,194,163,.1);
    --warn:#d8b877; --warn-bg:rgba(216,184,119,.1);
    --bad:#dc8f8a; --bad-bg:rgba(220,143,138,.1);
    --display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --body:'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --logo:'Times New Roman', Times, serif;
    --r:10px;
    --side:248px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.55;letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:1.5px solid var(--cream);outline-offset:2px}
  h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;line-height:1.2}
  h1{font-family:var(--display);font-size:clamp(26px,3.2vw,34px);letter-spacing:-.005em}
  h2{font-family:var(--display);font-size:19px}
  h3{font-size:14.5px;font-weight:600}
  .num{font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono);font-size:.92em;letter-spacing:0}
  svg.i{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .label{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600}

  /* ===== Shell ===== */
  .shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:26px 16px 18px}
  .brand{padding:0 10px 26px}
  .wordmark{font-family:var(--logo);font-weight:400;color:var(--cream);letter-spacing:.42em;font-size:17px;white-space:nowrap}
  .brand .label{display:block;margin-top:6px;letter-spacing:.12em;font-size:9.5px}
  .modes{display:grid;grid-template-columns:1fr 1fr;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:3px;margin:0 4px 22px}
  .modes button{background:none;border:0;border-radius:6px;padding:7px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .modes button[aria-pressed="true"]{background:var(--hover);color:var(--cream)}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav .label{padding:0 12px 8px}
  .nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--muted);text-align:left;font-size:14px;position:relative}
  .nav button:hover{color:var(--text);background:var(--raise)}
  .nav button[aria-current="page"]{color:var(--text);background:var(--raise)}
  .nav button[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:2px;background:var(--cream);border-radius:2px}
  .nav .end{margin-left:auto;color:var(--dim)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
  .conn{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);padding:0 12px}
  .conn .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .conn.live .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(148,194,163,.15)}
  .whoami{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
  .whoami .t{flex:1;min-width:0;line-height:1.3}
  .whoami b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .whoami span{font-size:12px;color:var(--dim)}
  .iconbtn{background:none;border:1px solid var(--line-2);border-radius:7px;width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
  .iconbtn:hover{color:var(--text);border-color:var(--cream)}
  .av{width:34px;height:34px;border-radius:50%;background:var(--hover);border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--cream);letter-spacing:.04em;flex:0 0 auto}
  .av.lg{width:58px;height:58px;font-family:var(--display);font-size:20px;font-weight:600}

  main{min-width:0;padding-inline:44px;padding-block:40px 110px}
  .page{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-bottom:26px;border-bottom:1px solid var(--line)}
  .ph .label{display:block;margin-bottom:10px;color:var(--cream)}
  .ph p{margin:8px 0 0;color:var(--muted);max-width:60ch}
  .ph-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* ===== Surfaces ===== */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
  .panel-h{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel-h p{margin:2px 0 0;color:var(--dim);font-size:13px}
  .panel-b{padding:22px}
  .cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:22px}

  /* ===== Buttons & chips ===== */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;letter-spacing:.03em;border:1px solid var(--line-2);background:var(--raise);color:var(--text);transition:border-color .15s,background .15s,color .15s;white-space:nowrap}
  .btn:hover{border-color:var(--cream)}
  .btn.pri{background:var(--cream);border-color:var(--cream);color:#0c0e1e}
  .btn.pri:hover{background:var(--cream-2)}
  .btn.ghost{background:transparent}
  .btn.danger{background:transparent;color:var(--bad);border-color:rgba(220,143,138,.35)}
  .btn.danger:hover{border-color:var(--bad)}
  .btn.sm{padding:7px 12px;font-size:12px}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn[disabled]:hover{border-color:var(--line-2)}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;font-weight:600}
  .chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}
  .chip.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
  .chip.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
  .chip.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
  .yes{color:var(--ok);display:inline-flex;align-items:center;gap:6px}
  .no{color:var(--dim);display:inline-flex;align-items:center;gap:6px}
  .miss{color:var(--warn);display:inline-flex;align-items:center;gap:6px}

  /* ===== Notice ===== */
  .notice{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--cream-2);color:#0c0e1e;border-radius:var(--r);padding:18px 22px}
  .notice b{font-family:var(--display);font-size:17px;font-weight:600;display:block}
  .notice p{margin:2px 0 0;font-size:13.5px;max-width:62ch;color:#2b2e44}
  .notice .btn.pri{background:#0c0e1e;border-color:#0c0e1e;color:var(--cream)}
  .notice .btn.pri:hover{background:#1a1d33}
  .notice.bad{background:var(--bad-bg);color:var(--text);border:1px solid rgba(220,143,138,.3)}
  .notice.bad b{color:var(--bad)}
  .notice.bad p{color:var(--muted)}

  /* ===== Identity / details ===== */
  .ident{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ident h2{font-size:23px}
  .ident .sub{color:var(--muted);font-size:13.5px;margin-top:2px}
  .dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0;border-top:1px solid var(--line)}
  .dl > div{padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
  .dl > div:nth-child(odd){padding-right:18px}
  .dl dt{margin-bottom:3px}
  .dl dd{margin:0;overflow-wrap:anywhere}
  .dl dd.empty{color:var(--warn);font-size:13.5px}

  /* ===== Checklist ===== */
  .meter{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .meter .bar{flex:1;height:4px;background:var(--raise);border-radius:4px;overflow:hidden}
  .meter .bar span{display:block;height:100%;background:var(--cream);border-radius:4px;transition:width .35s}
  .meter .n{font-size:12px;color:var(--muted)}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
  .step{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
  .step:first-child{border-top:0}
  .step .mk{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;color:var(--dim)}
  .step.done .mk{background:var(--cream);border-color:var(--cream);color:#0c0e1e}
  .step.done .mk svg{width:12px;height:12px;stroke-width:2.4}
  .step .s{font-size:12.5px;color:var(--dim)}
  .step.done .t{color:var(--muted)}

  /* ===== Contacts ===== */
  .contact{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .contact:first-child{border-top:0;padding-top:0}
  .contact .t{flex:1;min-width:0;line-height:1.35}
  .contact b{display:block;font-size:14px}
  .contact span{font-size:12.5px;color:var(--dim)}

  /* ===== Library ===== */
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{background:none;border:1px solid transparent;border-radius:7px;padding:7px 12px;font-size:12.5px;color:var(--muted)}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--raise);border-color:var(--line-2);color:var(--text)}
  .lib{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;min-height:176px;transition:border-color .15s}
  .doc:hover{border-color:var(--line-2)}
  .doc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .doc .ft{width:30px;height:38px;border:1px solid var(--line-2);border-radius:4px 9px 4px 4px;display:grid;place-items:end center;padding-bottom:5px;font-size:8.5px;letter-spacing:.12em;color:var(--dim);font-weight:600}
  .doc h3{font-size:15px;margin-top:6px}
  .doc p{margin:0;color:var(--muted);font-size:13px;flex:1}
  .doc .bt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
  .doc.locked h3,.doc.locked p{color:var(--dim)}
  .doc.locked p{filter:blur(2.5px);user-select:none}
  .lk{display:inline-flex;align-items:center;gap:6px}
  .lk svg{width:13px;height:13px}
  .empty{color:var(--dim);font-size:13.5px;padding:34px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r)}

  /* ===== Forms ===== */
  .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
  .field{display:flex;flex-direction:column;gap:7px;min-width:0}
  .field.full{grid-column:1/-1}
  .field label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .field label .req{color:var(--warn)}
  .field input,.field select,.field textarea{background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:11px 13px;width:100%;min-width:0;transition:border-color .15s}
  .field input:hover,.field select:hover,.field textarea:hover{border-color:#3a4062}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cream)}
  .field input:disabled,.field select:disabled{color:var(--muted);background:transparent;border-color:var(--line);cursor:default}
  .field .hint{font-size:12px;color:var(--dim)}
  .form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
  .err{color:var(--bad);font-size:13px}
  .sect{margin:28px 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .sect:first-child{margin-top:0}
  .sect span{font-size:12px;color:var(--dim)}

  /* ===== Auth ===== */
  .auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
  .auth-l{position:relative;padding:48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line);background:var(--surface);overflow:hidden}
  .auth-l canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
  .auth-l > *{position:relative}
  .auth-l h1{font-size:clamp(32px,4vw,46px);font-weight:600;margin-top:10px;max-width:14ch}
  .auth-l p{color:var(--muted);max-width:40ch;margin:16px 0 0}
  .auth-l .tag{font-family:Georgia,'Times New Roman',serif;font-weight:600;color:var(--cream);font-size:15px}
  .auth-r{display:grid;place-items:center;padding:48px 32px}
  .auth-card{width:min(440px,100%)}
  .auth-tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .auth-tabs button{background:none;border:0;padding:0 0 12px;color:var(--dim);font-size:14px;position:relative;font-weight:600}
  .auth-tabs button[aria-selected="true"]{color:var(--text)}
  .auth-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;background:var(--cream)}
  .auth-card h2{font-size:24px;margin-bottom:6px}
  .auth-card > p{color:var(--muted);margin:0 0 22px;font-size:13.5px}
  .auth-card .form{grid-template-columns:1fr}
  .auth-card .form.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .auth-card .btn.pri{width:100%;padding:12px}
  .auth-alt{margin-top:18px;font-size:13px;color:var(--dim)}
  .linkbtn{background:none;border:0;padding:0;color:var(--cream);font-weight:600;text-decoration:underline;text-underline-offset:3px}
  .auth-admin{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--dim);flex-wrap:wrap}

  /* ===== Agreement ===== */
  .terms{padding:4px 22px 22px;max-height:360px;overflow:auto}
  .terms h3{font-family:var(--display);font-size:15.5px;font-weight:600;color:var(--cream);margin:20px 0 4px}
  .terms p{margin:0;color:var(--muted);font-size:13.5px;max-width:70ch}
  .checks{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
  .ck{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
  .ck input{width:17px;height:17px;margin-top:3px;accent-color:#dfdcc9;flex:0 0 auto}
  .sign-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
  .pad{position:relative;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;height:168px;touch-action:none}
  .pad canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:8px;cursor:crosshair}
  .pad .base{position:absolute;left:20px;right:20px;bottom:38px;border-bottom:1px solid var(--line-2);pointer-events:none}
  .pad .x{position:absolute;left:20px;bottom:42px;font-family:var(--display);color:var(--dim);pointer-events:none}
  .pad .ph{position:absolute;inset:0 0 50px;display:grid;place-items:center;color:var(--dim);font-size:13px;pointer-events:none}
  .sigimg{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;display:block;width:100%;max-width:320px;height:auto}

  /* ===== Admin ===== */
  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  .stat{padding:18px 22px;border-left:1px solid var(--line)}
  .stat:first-child{border-left:0}
  .stat .v{font-family:var(--display);font-size:30px;font-weight:600;margin-top:4px;line-height:1.1}
  .stat .v.ok{color:var(--ok)} .stat .v.warn{color:var(--warn)} .stat .v.bad{color:var(--bad)}
  .search{display:flex;align-items:center;gap:8px;background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:0 12px;color:var(--dim);min-width:0}
  .search input{background:none;border:0;padding:9px 0;outline:none;min-width:0;width:220px;color:var(--text)}
  .search:focus-within{border-color:var(--cream)}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
  th{text-align:left;padding:12px 16px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer;transition:background .12s}
  tbody tr:hover{background:var(--raise)}
  tbody tr:last-child td{border-bottom:0}
  .who{display:flex;align-items:center;gap:12px;min-width:0}
  .who b{display:block;font-size:14px}
  .who span{font-size:12px;color:var(--dim)}
  td .sub{font-size:12px;color:var(--dim);display:block}

  /* ===== Modal ===== */
  .scrim{position:fixed;inset:0;background:rgba(3,4,12,.82);backdrop-filter:blur(3px);z-index:50;display:grid;place-items:center;padding:20px}
  .modal{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;width:min(720px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .modal.sm{width:min(460px,100%)}
  .mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}
  .mh p{margin:3px 0 0;color:var(--dim);font-size:12.5px}
  .mb{padding:22px;overflow:auto}
  .mf{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
  .mf .r{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .sheet{position:relative;background:#f8f7f3;color:#0c0e1e;border-radius:4px;aspect-ratio:210/297;width:400px;max-width:100%;margin:0 auto;padding:34px 32px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
  .sheet .w{font-family:var(--logo);letter-spacing:.38em;font-size:10.5px;color:#4a4f6a}
  .sheet h3{font-family:var(--display);font-size:21px;font-weight:600;margin:24px 0 8px}
  .sheet .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#4a4f6a;margin-top:22px;font-weight:600}
  .sheet .l{height:7px;border-radius:4px;background:#dcdad0;margin:9px 0}
  .wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .wm span{transform:rotate(-32deg);font-size:14px;letter-spacing:.14em;color:rgba(12,14,30,.13);white-space:nowrap;font-weight:600}
  .slots{display:flex;flex-direction:column;gap:8px}
  .slot{background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:13px 16px;display:flex;justify-content:space-between;gap:10px;text-align:left}
  .slot span{color:var(--dim);font-size:12.5px}
  .slot[aria-pressed="true"]{border-color:var(--cream)}
  .idbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:14px 16px;margin-top:14px}
  .idbox b{font-family:var(--display);font-size:22px;letter-spacing:.06em}
  .dz{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
  .dz:first-child{border-top:0;padding-top:0}
  .dz p{margin:2px 0 0;font-size:12.5px;color:var(--dim)}

  /* ===== Toast ===== */
  .toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--cream-2);color:#0c0e1e;padding:11px 18px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;transition:.22s;z-index:70;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:#3a2226;color:#f3d6d4}

  /* ===== Responsive ===== */
  @media (max-width:1100px){.lib{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:980px){
    .cols,.sign-grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat:nth-child(odd){border-left:0}
    .stat:nth-child(n+3){border-top:1px solid var(--line)}
    .auth{grid-template-columns:1fr}
    .auth-l{border-right:0;border-bottom:1px solid var(--line);padding:32px 24px;gap:40px}
  }
  @media (max-width:820px){
    .shell{grid-template-columns:minmax(0,1fr)}
    .side{min-width:0;max-width:100vw}
    .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
    .brand{padding:0;margin-right:auto}
    .brand .label{display:none}
    .modes{margin:0;order:2}
    .nav{order:4;flex-basis:100%;min-width:0;max-width:100%;flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px}
    .nav::-webkit-scrollbar{display:none}
    .nav .label{display:none}
    .nav button{white-space:nowrap;padding:8px 12px}
    .nav button[aria-current="page"]::before{display:none}
    .side-foot{order:3;margin:0;flex-direction:row;align-items:center}
    .conn,.whoami .t{display:none}
    .whoami{padding:4px;border:0;background:none}
    main{padding-inline:16px;padding-block:26px 100px}
    .lib,.form,.dl{grid-template-columns:1fr}
    .dl > div:nth-child(odd){padding-right:0}
    .auth-card .form.two{grid-template-columns:1fr}
    .auth-r{padding:32px 16px}
    .search input{width:140px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  /* ===== Live-version additions ===== */
  .boot{min-height:100vh;display:grid;place-items:center;color:var(--dim);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
  .inbox{display:flex;flex-direction:column;gap:14px}
  .inbox .mailicon{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--cream)}
  .inbox .mailicon svg{width:20px;height:20px}
  .inbox b.addr{color:var(--text);font-weight:600}
  .auth-links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--dim)}
  .code-input{letter-spacing:.4em;font-family:var(--mono);font-size:18px !important;text-align:center}
  .modal.lg{width:min(980px,100%)}
  .viewer{position:relative;background:var(--bg);border-radius:8px;overflow:auto;min-height:55vh;max-height:72vh;display:flex;justify-content:center;align-items:flex-start;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .viewer canvas{display:block;max-width:none;background:#fff;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .viewer video,.viewer img{max-width:100%;max-height:70vh;display:block;margin:auto}
  .viewer .wmgrid{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:170px;overflow:hidden}
  .viewer .wmgrid span{transform:rotate(-30deg);align-self:center;justify-self:center;white-space:nowrap;font-size:12.5px;letter-spacing:.1em;font-weight:600;color:rgba(223,220,201,.16)}
  .vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .vbar .num{color:var(--muted);font-size:13px;min-width:92px;text-align:center}
  .upload{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px 18px}
  .drop{grid-column:1/-1;border:1px dashed var(--line-2);border-radius:8px;padding:18px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;background:var(--raise)}
  .drop input[type=file]{color:var(--muted);font-size:13px;max-width:100%}
  .switch-row{grid-column:1/-1;display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
  .switch-row input{width:17px;height:17px;margin-top:3px;accent-color:#dfdcc9;flex:0 0 auto}
  .switch-row span{color:var(--dim);font-size:12.5px;display:block}
  .files{display:flex;flex-direction:column}
  .frow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 22px;border-top:1px solid var(--line)}
  .frow:first-child{border-top:0}
  .frow b{display:block;font-size:14px}
  .frow span{font-size:12.5px;color:var(--dim)}
  .locked-lib{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 24px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted)}
  .locked-lib svg{width:26px;height:26px;color:var(--dim)}
  .fatal{max-width:520px;margin:18vh auto 0;padding:0 16px;text-align:center;color:var(--muted)}
  .fatal h1{margin-bottom:10px;color:var(--text)}
  .ndoc{display:grid;grid-template-columns:212px minmax(0,1fr);border-top:1px solid var(--line);position:relative}
  .ndoc-bar{position:absolute;top:-1px;left:0;right:0;height:2px;background:transparent;z-index:2;pointer-events:none}
  .ndoc-bar i{display:block;height:100%;width:0;background:var(--cream);border-radius:0 2px 2px 0;transition:width .12s linear}
  .ntoc{border-right:1px solid var(--line);padding:20px 10px 20px 12px;max-height:min(74vh,700px);overflow:auto;font-size:12.5px}
  .ntoc .label{display:block;margin:0 0 10px 10px}
  .ntoc button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px;padding:6px 10px;border-radius:6px;color:var(--dim);line-height:1.35;cursor:pointer}
  .ntoc button:hover{background:var(--hover);color:var(--muted)}
  .ntoc button:focus-visible{outline:2px solid var(--line-2)}
  .ntoc button.on{background:var(--raise);color:var(--text)}
  .ntoc button span{font-family:var(--mono);font-size:10.5px;color:var(--dim);padding-top:2px}
  .ntoc button.on span{color:var(--cream)}
  .ntoc .nsep{height:1px;background:var(--line);margin:8px 10px}
  .ntoc .nread{margin:14px 10px 0;font-size:11.5px;color:var(--dim)}
  .ntoc .nread b{color:var(--muted);font-weight:500}
  .nda{position:relative;padding:0 clamp(18px,4.5vw,56px) 36px;max-height:min(74vh,700px);overflow:auto;font-size:14px;line-height:1.75;color:var(--muted);scroll-behavior:smooth}
  .nda:focus-visible{outline:2px solid var(--line-2);outline-offset:-2px}
  .nda .cover{text-align:center;padding:48px 0 34px;margin:0 auto;max-width:64ch;border-bottom:1px solid var(--line)}
  .nda .cover .between{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  .nda .cover h2{font-family:var(--display);font-size:clamp(25px,3.2vw,32px);font-weight:600;color:var(--text);line-height:1.15;margin:16px 0 10px;letter-spacing:-.01em}
  .nda .cover .sub{font-size:13.5px;color:var(--muted);margin:0}
  .nda .cover .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:22px}
  .nda .cover .meta span{border:1px solid var(--line-2);border-radius:999px;padding:3px 11px;font-size:11.5px;color:var(--muted)}
  .nda .dated{max-width:68ch;margin:28px auto 0;padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:var(--raise);color:var(--text);font-size:13.5px}
  .nsec{max-width:68ch;margin:0 auto;padding:34px 0 6px}
  .nsec+.nsec,.nkick+.nsec{border-top:1px solid var(--line)}
  .nkick{max-width:68ch;margin:36px auto 0;display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .nkick::before,.nkick::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .nkick+.nsec{border-top:0;padding-top:22px}
  .nsec h3{display:flex;align-items:baseline;gap:14px;font-family:var(--display);font-size:21px;font-weight:600;color:var(--text);margin:0 0 18px;letter-spacing:-.005em;line-height:1.25}
  .nsec h3 .n{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--cream);border:1px solid var(--line-2);border-radius:6px;padding:1px 7px;transform:translateY(-3px)}
  .nda p{margin:0 0 14px}
  .nda p.nc{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:start}
  .nda p.nc>.no{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--cream);line-height:24.5px}
  .nda p.nc .lead-in{color:var(--text);font-weight:600}
  .nda p.ni{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;margin:-6px 0 12px 44px}
  .nda .nsec.pre p.ni{margin:0 0 12px}
  .nda p.ni>.no{color:var(--dim);font-weight:500}
  .nda p.nd{margin:0 0 0 44px;padding:13px 18px;background:var(--raise);border:1px solid var(--line);border-top:0}
  .nda p.nd>.no{display:block;color:var(--cream-2);font-weight:600;margin-bottom:2px}
  .nda p:not(.nd)+p.nd{border-top:1px solid var(--line);border-radius:8px 8px 0 0;margin-top:-4px}
  .nda p.nd:has(+ :not(.nd)),.nda p.nd:last-child{border-radius:0 0 8px 8px;margin-bottom:16px}
  .nda p:not(.nd)+p.nd:has(+ :not(.nd)){border-radius:8px}
  .nda .nsec.guard p{color:var(--dim)}
  .nend{max-width:68ch;margin:30px auto 0;display:flex;align-items:center;gap:10px;padding:14px 18px;border:1px dashed var(--line-2);border-radius:8px;font-size:13px;color:var(--dim);transition:color .2s,border-color .2s}
  .nend svg{width:16px;height:16px;flex:0 0 auto}
  .ndoc.read .nend{color:var(--ok);border-color:rgba(148,194,163,.35);border-style:solid;background:var(--ok-bg)}
  .ndoc.read .ndoc-bar i{background:var(--ok)}
  .sched{width:100%;border-collapse:collapse;font-size:13.5px;min-width:0}
  .sched th{width:42%;background:transparent;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);font-weight:500;padding:11px 14px;border-bottom:1px solid var(--line)}
  .sched td{padding:11px 14px;border-bottom:1px solid var(--line)}
  .sched tr:last-child th,.sched tr:last-child td{border-bottom:0}
  .sched td.empty{color:var(--warn)}
  .chip.dl{color:var(--cream);border-color:var(--line-2)}
  .act-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .act-filters select{background:var(--raise);border:1px solid var(--line-2);border-radius:8px;padding:9px 12px}
  .actlist{display:flex;flex-direction:column}
  .actrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
  .actrow:first-child{border-top:0}
  .actrow span{color:var(--dim)}
  .busy{opacity:.6;pointer-events:none}
  @media (max-width:820px){.upload{grid-template-columns:1fr}.ndoc{grid-template-columns:1fr}.ntoc{display:none}.nda{padding:0 18px 22px;max-height:70vh}.nda p.ni,.nda p.nd{margin-left:0}.nda p.nc{grid-template-columns:38px minmax(0,1fr)}}
  @media print{body *{display:none !important}body::after{content:"Printing is turned off for Vantedge materials.";display:block !important;padding:40px;font:16px sans-serif}}
</style>

    if(/rate limit|too many|429|security purposes/i.test(m)) return 'Too many attempts. Wait a minute, then try again.';
    if(/approved you/i.test(m)) return 'You can sign once the team has approved you.';
    if(/complete your details/i.test(m)) return 'Complete your details before signing.';
    if(/under 18|guardian/i.test(m)) return 'Members under 18 need a parent or guardian to sign. Contact the team at contact@vantedgeorg.com.';
    if(/duplicate|unique|already exists/i.test(m)) return 'This already exists.';
    if(/payload too large|maximum allowed size|exceeded the maximum/i.test(m)) return `That file is too big. The limit is ${MAX_UPLOAD_MB} MB.`;
    if(/row-level security|permission|not allowed|violates|unauthorized|403/i.test(m)) return 'You don\'t have permission to do that.';
    if(/sending (magic link|confirmation|recovery)? ?email|smtp|535|authentication failed|username and password/i.test(m)) return 'Couldn\'t send the email. The portal\'s email settings need fixing. (' + m + ')';
    if(/failed to fetch|networkerror|network request/i.test(m)) return 'Couldn\'t reach the server. Check your connection and try again.';
    return 'Something went wrong. Try again, and tell the team if it keeps happening.' + (m ? ' (' + m + ')' : '');
  }
  async function run(fn, okMsg){

    return scripts[src];
  }

    S.members = (mr.data || []).map(fromRow);
    S.me = S.members.find(m => m.userId === uid) || null;

  function drawGrain(){
    const c = $('#grain'); if(!c) return;
    const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio||1);
    c.width = r.width*dpr; c.height = r.height*dpr;
    const x = c.getContext('2d'); x.scale(dpr,dpr);
    for(let yy=18; yy<r.height; yy+=18){
      for(let xx=18; xx<r.width; xx+=18){
        const dx = xx - r.width*0.85, dy = yy - r.height*0.15;
        const a = Math.max(0, 0.5 - (Math.sqrt(dx*dx+dy*dy) / Math.max(r.width, r.height))*0.75);
        if(a <= 0.02) continue;
        x.fillStyle = `rgba(223,220,201,${a.toFixed(3)})`; x.beginPath(); x.arc(xx, yy, 0.9, 0, Math.PI*2); x.fill();
      }
    }
  }

  function docCard(r){
    const k = fileKind(r), canView = ['PDF','VIDEO','IMG'].includes(k);
    return `<article class="doc">
      <div class="top"><span class="label">${esc(divLabel(r.division))}</span><span class="ft">${k}</span></div>
      <h3>${esc(r.title)}</h3><p>${esc(r.description||'')}</p>
      <div class="bt"><span class="num">${esc(fmtSize(r.file_size))}${r.file_size?' · ':''}${r.allow_download?'Downloadable':'View only'}</span>
        <span style="display:flex;gap:6px">${canView?`<button type="button" class="btn sm" data-open="${esc(r.id)}">View</button>`:''}${r.allow_download?`<button type="button" class="btn sm ${canView?'ghost':''}" data-dl="${esc(r.id)}">${ic('download')} Download</button>`:''}${!canView&&!r.allow_download?`<button type="button" class="btn sm" data-open="${esc(r.id)}">View</button>`:''}</span></div>
    </article>`;
  }
  function library(m){
    const head = `<header class="ph"><div><span class="label">Library</span><h1>Handbooks and materials</h1>
        <p>Handbooks open here, watermarked with your name and member ID. Templates can be downloaded. Nothing to keep in a Drive once you leave.</p></div>
        <div class="ph-r">${hasAccess(m)?'<span class="chip ok"><span class="d"></span>Unlocked</span>':'<span class="chip"><span class="d"></span>Locked</span>'}</div></header>`;
    if(!hasAccess(m)){
      const why = m.revoked ? 'Your access has been removed.' : !m.approved ? 'Your library unlocks once the team approves you and you sign the Vantedge NDA.' : !complete(m) ? 'Finish your details, then sign the Vantedge NDA to unlock it.' : 'Sign the Vantedge NDA to unlock it.';
      return `<div class="page">${head}${notice(m)}<div class="locked-lib">${ic('lock')}<b style="color:var(--text)">Library locked</b><span>${why}</span></div></div>`;
    }
    const fs = [['mine','For you'],['all','Everything'],['Research','Research'],['Growth','Growth'],['All','General'],['templates','Templates']];
    let list = S.resources;
    if(S.filter==='mine') list = list.filter(r=>forMember(r, m));
    else if(S.filter==='Research') list = list.filter(r=>r.division==='All Research' || VERTICALS.Research.includes(r.division));
    else if(S.filter==='Growth') list = list.filter(r=>r.division==='All Growth' || VERTICALS.Growth.includes(r.division));
    else if(S.filter==='All') list = list.filter(r=>r.division==='All');
    else if(S.filter==='templates') list = list.filter(r=>r.allow_download);
    return `<div class="page">${head}
      <div class="toolbar"><div class="seg" role="group" aria-label="Filter">${fs.map(([k,l])=>`<button type="button" data-filter="${esc(k)}" aria-pressed="${S.filter===k}">${l}</button>`).join('')}</div>
        <span class="label num">${list.length} item${list.length===1?'':'s'}</span></div>
      ${list.length?`<div class="lib">${list.map(docCard).join('')}</div>`:'<div class="empty">Nothing here yet. The team adds materials over time.</div>'}
    </div>`;
  }

  /* ================= LOCKED VIEWER ================= */
  let viewerState = null;
  function viewerKeys(e){
    if(!$('#viewerBox')) return;
    const k = (e.key||'').toLowerCase();
    if((e.metaKey || e.ctrlKey) && (k==='s' || k==='p')){ e.preventDefault(); e.stopPropagation(); toast('Saving and printing are turned off for Vantedge materials.'); return; }
    if(viewerState && viewerState.pdf){
      if(k==='arrowright' || k==='pagedown'){ e.preventDefault(); goPage(1); }
      if(k==='arrowleft' || k==='pageup'){ e.preventDefault(); goPage(-1); }
    }
  }
  const wmText = () => S.mode==='admin' ? 'Admin preview · Vantedge confidential' : `${S.me?S.me.name:''} · ${S.me?S.me.code:''} · Vantedge confidential`;
  function stampCanvas(ctx, w, h, dark){
    const t = wmText();
    ctx.save();
    ctx.globalAlpha = dark ? 0.18 : 0.13; ctx.fillStyle = dark ? '#dfdcc9' : '#0c0e1e';
    const fs = Math.max(11, Math.round(w/48)); ctx.font = `600 ${fs}px "IBM Plex Sans", Arial, sans-serif`;
    ctx.translate(w/2, h/2); ctx.rotate(-Math.PI/6);
    const tw = ctx.measureText(t).width + fs*4, step = fs*7;
    for(let y=-h; y<h; y+=step){ for(let x=-w*1.2; x<w*1.2; x+=tw){ ctx.fillText(t, x + ((y/step)%2?tw/2:0), y); } }
    ctx.restore();
  }
  async function openViewer(r, opts={}){
    MS = {kind:'viewer', rid:r.id};
    const k = opts.kind || fileKind(r);
    const title = opts.title || r.title;
    const canDl = !!opts.allowDownload;
    modal(`<div class="modal lg" role="dialog" aria-modal="true" aria-labelledby="vw-h">
      <div class="mh"><div><h2 id="vw-h">${esc(title)}</h2><p>${canDl?'Downloadable':'View only'} · watermarked${k==='PDF'?' · use ← → to turn pages':''}</p></div><button type="button" class="iconbtn" data-close aria-label="Close">${ic('x')}</button></div>
      <div class="mb" style="background:var(--bg);padding:14px"><div class="viewer" id="viewerBox" oncontextmenu="return false"><span class="label" style="margin:auto;padding:40px">Opening…</span></div></div>
      <div class="mf"><div class="vbar" id="vbar"></div><div class="r">${canDl?`<button type="button" class="btn sm" data-dlnow="1">${ic('download')} Download</button>`:''}</div></div></div>`);
    document.addEventListener('keydown', viewerKeys, true);
    const st = viewerState = {closed:false, r, opts, kind:k};
    const expires = k==='VIDEO' ? 4*3600 : 120;
    const { data, error } = await sb.storage.from(opts.bucket || BUCKET).createSignedUrl(opts.path || r.file_path, expires);
    if(st.closed) return;
    const box = $('#viewerBox');
    if(error || !data || !data.signedUrl){ box.innerHTML = `<div class="empty" style="border:0;margin:auto">${esc(friendly(error||'Could not open the file.'))}</div>`; return; }
    const url = data.signedUrl;
    try{
      if(k==='PDF'){
        await loadScript(LIB.pdfjs);
        const pdfjs = window.pdfjsLib; pdfjs.GlobalWorkerOptions.workerSrc = LIB.pdfjsWorker;
        const pdf = await pdfjs.getDocument({url, disableAutoFetch:false}).promise;
        if(st.closed) return;
        st.pdf = pdf; st.page = 1; st.zoom = 1;
        $('#vbar').innerHTML = `<button type="button" class="btn sm" data-vpage="-1">Previous</button><span class="num" id="vnum"></span><button type="button" class="btn sm" data-vpage="1">Next</button><button type="button" class="btn sm ghost" data-vzoom="-1" aria-label="Zoom out">−</button><button type="button" class="btn sm ghost" data-vzoom="1" aria-label="Zoom in">+</button>`;
        await renderPdfPage();
      } else if(k==='VIDEO'){
        box.innerHTML = `<video src="${esc(url)}" controls controlslist="nodownload noplaybackrate" disablepictureinpicture playsinline oncontextmenu="return false"></video><div class="wmgrid" aria-hidden="true">${Array.from({length:18}).map(()=>`<span>${esc(wmText())}</span>`).join('')}</div>`;
      } else if(k==='IMG'){
        const img = new Image(); img.crossOrigin = 'anonymous';
        img.onload = () => { if(st.closed) return; const c = document.createElement('canvas'); const maxW = Math.min(box.clientWidth-20, img.naturalWidth); const s = maxW / img.naturalWidth; c.width = img.naturalWidth; c.height = img.naturalHeight; c.style.width = Math.round(img.naturalWidth*s)+'px'; const x = c.getContext('2d'); x.drawImage(img,0,0); stampCanvas(x, c.width, c.height, false); box.innerHTML = ''; box.appendChild(c); };
        img.onerror = () => { box.innerHTML = '<div class="empty" style="border:0;margin:auto">Could not open the image.</div>'; };
        img.src = url;
      } else {
        box.innerHTML = `<div style="margin:auto;text-align:center;padding:40px;display:flex;flex-direction:column;gap:14px;align-items:center"><p style="margin:0;color:var(--muted);max-width:44ch">${canDl?'This file type can\'t be previewed in the portal. Download it to open it in PowerPoint, Word or Excel.':'This file type can\'t be shown in the locked viewer. Ask the team for a PDF version.'}</p></div>`;
      }
    }catch(e){ console.error(e); if(!st.closed) box.innerHTML = `<div class="empty" style="border:0;margin:auto">${esc(friendly(e))}</div>`; }
  }
  async function renderPdfPage(){
    const st = viewerState; if(!st || !st.pdf || st.closed) return;
    const box = $('#viewerBox'); if(!box) return;
    const page = await st.pdf.getPage(st.page);
    if(st.closed) return;
    const base = page.getViewport({scale:1});
    const fitW = Math.max(280, box.clientWidth - 24);
    const cssScale = (fitW / base.width) * st.zoom;
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const vp = page.getViewport({scale: cssScale * dpr});
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = Math.floor(vp.width/dpr)+'px'; c.style.height = Math.floor(vp.height/dpr)+'px';
    const ctx = c.getContext('2d');
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    if(st.closed) return;
    stampCanvas(ctx, c.width, c.height, false);
    box.innerHTML = ''; box.appendChild(c); box.scrollTop = 0;
    const n = $('#vnum'); if(n) n.textContent = `Page ${st.page} of ${st.pdf.numPages}`;
    document.querySelectorAll('[data-vpage="-1"]').forEach(b=>b.disabled = st.page<=1);
    document.querySelectorAll('[data-vpage="1"]').forEach(b=>b.disabled = st.page>=st.pdf.numPages);
  }
  function goPage(d){ const st = viewerState; if(!st || !st.pdf) return; const p = Math.max(1, Math.min(st.pdf.numPages, st.page + d)); if(p !== st.page){ st.page = p; renderPdfPage(); } }
  async function downloadResource(r){

    toast('Download started');

  function render(){

    const keep = {}; const onAuthScreen = !!$('.auth-card'); if(onAuthScreen || (ae && ae.id && /^(p-|c-|u-|typed|aq)/.test(ae.id))) { document.querySelectorAll('#app input,#app select,#app textarea').forEach(el=>{ if(!el.id || el.type==='file') return; keep[el.id] = el.type==='checkbox' ? el.checked : el.value; }); }

    if(!S.session){ app.innerHTML = authView(); requestAnimationFrame(drawGrain); }
    else if(S.recovering){ app.innerHTML = newPassView(); requestAnimationFrame(drawGrain); }
    else if(S.mode==='admin' && S.isAdmin){ app.innerHTML = shell(S.adminTab==='library' ? adminLibrary() : S.adminTab==='activity' ? adminActivity() : adminMembers()); }
    else if(!S.me){ app.innerHTML = createView(); requestAnimationFrame(drawGrain); }
    else {
      const v = {overview, profile, library, nda}[S.tab] || overview;
      app.innerHTML = shell(v(S.me));

    Object.keys(keep).forEach(id => { const el = document.getElementById(id); if(!el) return; if(el.type==='checkbox') el.checked = keep[id]; else if(!el.disabled) el.value = keep[id]; });
    if(focusId){ const el = document.getElementById(focusId); if(el && el !== document.activeElement){ el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart, selStart); }catch(e){} } }
    if(MS && MS.kind==='member') memberModal(MS.id);
  }
  function setNav(k, edit){
    if(S.mode==='admin'){ S.adminTab = k; if(k==='activity') S.logs = null; } else { if(S.tab !== k) ndaScrollTop = 0; S.tab = k; S.editing = !!edit; }
    closeModal(); render(); window.scrollTo({top:0, behavior:'smooth'});
    if(edit) setTimeout(()=>{ const f=document.querySelector('#pForm input:not([disabled])'); if(f) f.focus(); }, 40);
  }
  document.addEventListener('change', e => {
    const id = e.target.id || '';
    const m = id.match(/^(c|n|a)-vertical$/);
    if(m){ const p = m[1], v = e.target.value; $('#'+p+'-division').innerHTML = opts(VERTICALS[v], VERTICALS[v][0]); $('#'+p+'-role').innerHTML = opts(ROLES[v], ROLES[v][0]); }
    if(/^a-(vertical|division|role)$/.test(id) && MS && MS.kind==='member') MS.dirty = true;
    if(id === 'u-file'){
      const f = e.target.files && e.target.files[0], t = $('#u-title');
      if(f && t && !t.value.trim()) t.value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g,' ').trim();
      if(f) $('#u-dl').checked = isPpt(f.name);
    }
    if(id === 'atype'){ S.actType = e.target.value; render(); }
  });
  async function copyText(text, fallbackId){
    try{ await navigator.clipboard.writeText(text); toast('Copied'); }
    catch(err){ const el = fallbackId && $('#'+fallbackId); if(el){ const s=window.getSelection(), rg=document.createRange(); rg.selectNodeContents(el); s.removeAllRanges(); s.addRange(rg); toast('Selected. Press Cmd+C or Ctrl+C to copy.'); } else toast(text); }
  }
  const upd = (id, patch, ok) => run(async () => { const r = await sb.from('members').update(patch).eq('id', id).select(); if(!r.error && (!r.data || !r.data.length)) return {error:{message:'permission'}}; return r; }, ok);

  /* ================= EVENTS ================= */
  document.addEventListener('click', async e => {
    if(e.target.id === 'scrim'){ closeModal(); return; }
    const ab = e.target.closest('button[data-approve]');
    if(ab){ ab.disabled = true; await upd(ab.dataset.approve, {approved:true, approved_at:nowISO()}, 'Member approved'); await loadAll(); return; }
    const row = e.target.closest('tr[data-view]');
    if(row){ MS = null; memberModal(row.dataset.view); return; }
    const t = e.target.closest('button'); if(!t) return;
    const d = t.dataset, m = S.me;

    if(d.auth){ const em = (document.querySelector('.auth-card input[type=email]')||{}).value; if(em) S.authEmail = em.trim(); S.auth = d.auth; render(); setTimeout(()=>{ const f = document.querySelector('.auth-card input'); if(f) f.focus(); }, 30); return; }
    if(d.mode){ S.mode = d.mode; if(d.mode==='admin') S.adminTab='members'; closeModal(); render(); window.scrollTo({top:0}); return; }
    if(d.nav){ setNav(d.nav, d.edit); return; }
    if(d.filter){ S.filter = d.filter; render(); return; }
    if(d.status){ S.statusF = d.status; render(); return; }
    if('close' in d){ closeModal(); return; }
    if(d.vpage){ goPage(+d.vpage); return; }
    if(d.vzoom){ const st = viewerState; if(st && st.pdf){ st.zoom = Math.max(0.6, Math.min(2.5, st.zoom + (+d.vzoom)*0.25)); renderPdfPage(); } return; }
    if(d.dlnow){ const st = viewerState; if(st){ if(st.opts.bucket){ const r = await sb.storage.from(st.opts.bucket).createSignedUrl(st.opts.path, 60, {download: st.opts.fileName || true}); if(r.data){ const a=document.createElement('a'); a.href=r.data.signedUrl; document.body.appendChild(a); a.click(); a.remove(); } else toast(friendly(r.error), true); } else downloadResource(st.r); } return; }
    if(d.open){
      const r = S.resources.find(x=>x.id===d.open); if(!r) return;
      openViewer(r, {allowDownload: !!r.allow_download});
      logAccess(r, 'view');
      if(S.mode!=='admin' && m && !m.handbookAt && forMember(r, m)){ upd(m.id, {handbook_at:nowISO()}).then(()=>loadAll(true)); }
      return;
    }
    if(d.dl){
      const r = S.resources.find(x=>x.id===d.dl); if(!r) return;
      await downloadResource(r);
      if(S.mode!=='admin' && m && !m.handbookAt && forMember(r, m)){ upd(m.id, {handbook_at:nowISO()}).then(()=>loadAll(true)); }
      return;
    }
    if(d.signedpdf){
      const mm = S.members.find(x=>x.id===d.signedpdf); if(!mm || !mm.ndaPath) return;
      openViewer({id:'nda-'+mm.id, title:`Vantedge NDA · ${mm.signedName||mm.name}`}, {kind:'PDF', bucket:NDA_BUCKET, path:mm.ndaPath, allowDownload:true, fileName:`Vantedge-NDA-${mm.code}.pdf`});
      return;
    }
    if(d.editfile){ editFileModal(d.editfile); return; }
    if(d.delfile){ S.confirmFile = d.delfile; render(); return; }
    if(d.delfileYes){
      const r = S.resources.find(x=>x.id===d.delfileYes); S.confirmFile = null; if(!r){ render(); return; }
      t.disabled = true;
      await run(async () => { const a = await sb.from('resources').delete().eq('id', r.id); if(a.error) return a; await sb.storage.from(BUCKET).remove([r.file_path]); return a; }, 'File deleted');
      await loadAll(); return;
    }
    if(t.id === 'editBtn'){ S.editing = true; render(); setTimeout(()=>$('#p-name')?.focus(), 30); return; }
    if(t.id === 'cancelEdit'){ S.editing = false; render(); return; }
    if(t.id === 'resend'){ if(S.cooldown>0) return; const r = await sb.auth.resend({type:'signup', email:S.authEmail, options:{emailRedirectTo:portalLink()}}); if(r.error) authErr(friendly(r.error)); else { toast('New code sent'); startCooldown(); } return; }
    if(t.id === 'resendReset'){ if(S.cooldown>0) return; const r = await sb.auth.resetPasswordForEmail(S.authEmail, {redirectTo:portalLink()}); if(r.error) authErr(friendly(r.error)); else { toast('New code sent'); startCooldown(); } return; }

    switch(d.act){
      case 'signout': unsubscribe(); S.session = null; await sb.auth.signOut(); S.recovering=false; S.auth='login'; S.pendingPw=''; S.tab='overview'; S.adminTab='members'; S.mode='member'; S.q=''; S.statusF='all'; S.filter='mine'; S.editing=false; S.logs=null; closeModal(); afterAuth(); toast('Signed out'); return;
      case 'confirmedLogin': { setSending(true); const r = await sb.auth.signInWithPassword({email:S.authEmail, password:S.pendingPw}); setSending(false); if(r.error) authErr(/not confirmed/i.test(r.error.message||'') ? 'Your email isn\'t confirmed yet. Enter the code, or click the link in the email first.' : friendly(r.error)); else { S.pendingPw=''; } return; }
      case 'password': passwordModal(); return;
      case 'copyLink': copyText(portalLink(), 'linkText'); return;
      case 'csv': downloadCsv(); return;
      case 'reloadLogs': S.logs = null; render(); return;
      case 'memberLogs': { const id = MS.id; await loadLogs(); memberModal(id); return; }
      case 'add': addModal(); return;
      case 'cancelFile': S.confirmFile = null; render(); return;
      case 'saveRole': { const id = MS.id; const ok = await upd(id, {vertical:$('#a-vertical').value, division:$('#a-division').value, role:$('#a-role').value}, 'Role saved'); if(ok && MS) MS.dirty = false; await loadAll(); return; }
      case 'approve': { const id = MS.id; await upd(id, {approved:true, approved_at:nowISO()}, 'Member approved'); await loadAll(); return; }
      case 'revoke': MS.confirm='revoke'; memberModal(MS.id); return;
      case 'delete': MS.confirm='delete'; memberModal(MS.id); return;
      case 'cancelConfirm': MS.confirm=null; memberModal(MS.id); return;
      case 'revokeYes': { const id = MS.id; MS.confirm=null; await upd(id, {revoked:true, revoked_at:nowISO()}, 'Access revoked. Their library is now closed.'); await loadAll(); return; }
      case 'restore': { const id = MS.id; await upd(id, {revoked:false, revoked_at:null}, 'Access restored'); await loadAll(); return; }
      case 'deleteYes': { const id = MS.id; MS = null; closeModal(); await run(()=>sb.from('members').delete().eq('id', id), 'Record deleted'); await loadAll(); return; }
    }
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && $('#scrim')) closeModal();
    if(e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-view]')){ MS=null; memberModal(e.target.dataset.view); }
  });
  document.addEventListener('input', e => {
    if(e.target.id === 'q'){ S.q = e.target.value; render(); }
    if(e.target.id === 'aq'){ S.actQ = e.target.value; render(); }
  });
  window.addEventListener('resize', () => { if($('#grain')) drawGrain(); });
  document.addEventListener('contextmenu', e => { if(e.target.closest && e.target.closest('#viewerBox')) e.preventDefault(); });

  document.addEventListener('submit', async e => {
    e.preventDefault();
    const f = e.target.id, val = id => ($('#'+id)?.value || '').trim();
    const emailOk = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    const pwCheck = (a, b) => a.length < 8 ? 'Choose a password with at least 8 characters.' : a !== b ? 'The two passwords don\'t match.' : '';

    if(f === 'loginForm'){
      const email = val('l-email').toLowerCase(), pw = $('#l-pw').value;
      S.authEmail = email;
      if (!emailOk(email)) return authErr('Enter a valid email.');
      if (!pw) return authErr('Enter your password.');
      setSending(true);
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
      setSending(false);
      if(error){
        return authErr(friendly(error));
      }
      if (pw === DEFAULT_TEMP_PASSWORD) {
        S.recovering = true; // Triggers the "Choose a new password" screen (newPassView)
        render();
        toast("Welcome to Vantedge! Please set your permanent password to continue.");
        return;
      }
    }
    if(f === 'forgotForm'){
      const email = val('f-email').toLowerCase(); S.authEmail = email;
      if(!emailOk(email)) return authErr('Enter a valid email.');
      setSending(true);
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: portalLink() });
      setSending(false);
      if(error) return authErr(friendly(error));
      S.auth = 'reset'; startCooldown(); render(); setTimeout(()=>$('#r-code')?.focus(), 30);
    }
    if(f === 'resetForm'){
      const code = val('r-code').replace(/\D/g,''), pw = $('#r-pw').value, pw2 = $('#r-pw2').value;
      if(code.length < 6) return authErr('Enter the code from the email.');
      const pe = pwCheck(pw, pw2); if(pe) return authErr(pe);
      setSending(true);
      const v = await sb.auth.verifyOtp({ email:S.authEmail, token:code, type:'recovery' });
      if(v.error){ setSending(false); return authErr(friendly(v.error)); }
      const u = await sb.auth.updateUser({ password: pw });
      setSending(false);
      if(u.error) return authErr(friendly(u.error));
      toast('Password saved. You\'re logged in.');
    }
    if(f === 'newPassForm'){
      const pw = $('#n-pw').value, pw2 = $('#n-pw2').value;
      const pe = pwCheck(pw, pw2); if(pe) return authErr(pe);
      const u = await sb.auth.updateUser({ password: pw });
      if(u.error) return authErr(friendly(u.error));
      S.recovering = false; toast('Password saved'); afterAuth();
    }
    if(f === 'pwForm'){
      const pw = $('#w-pw').value, pw2 = $('#w-pw2').value;
      const pe = pwCheck(pw, pw2); if(pe){ $('#pwErr').textContent = pe; return; }
      const u = await sb.auth.updateUser({ password: pw });
      if(u.error){ $('#pwErr').textContent = friendly(u.error); return; }
      closeModal(); toast('Password changed');
    }
    if(f === 'createForm'){
      const name = val('c-name');
      if(!name){ $('#createErr').textContent = 'Enter your full name.'; return; }
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
      const r = await sb.from('members').insert({ name, email:myEmail(), vertical:$('#c-vertical').value, division:$('#c-division').value, role:$('#c-role').value, first_participation: todayISO() }).select();
      btn.disabled = false;
      if(r.error){
        if(/duplicate|unique/i.test(r.error.message||'')){ try{ await sb.rpc('claim_member'); }catch(x){} await loadAll(); if(S.me){ toast('Found your existing record. Welcome back.'); return; } }
        $('#createErr').textContent = friendly(r.error); return;
      }
      S.tab='profile'; S.editing = true; await loadAll(); toast('Profile created. The team will approve you shortly.'); setTimeout(()=>$('#p-phone')?.focus(), 60);
    }
    if(f === 'pForm'){
      const m = S.me, err = $('#pErr');
      const patch = {name:val('p-name'), preferred:val('p-preferred'), phone:val('p-phone'), university:val('p-university'), chapter:$('#p-chapter').value, country:val('p-country'), timezone:val('p-timezone'), first_participation:val('p-first'), adult:$('#p-adult').value, linkedin:val('p-linkedin')};
      if(!patch.name){ err.textContent = 'Full name can\'t be empty.'; return; }
      if(patch.phone && !/^\+\d[\d\s-]{6,}$/.test(patch.phone)){ err.textContent = 'Start your phone number with + and the country code, like +60 12-345 6789.'; return; }
      if(patch.first_participation && patch.first_participation > todayISO()){ err.textContent = 'Date of first participation can\'t be in the future.'; return; }
      const ok = await upd(m.id, patch);
      if(ok){
        S.editing = false; await loadAll();
        const after = Object.assign({}, m, patch, {firstParticipation:patch.first_participation});
        const left = missing(after).length;
        toast(left ? `Saved. ${left} required field${left===1?'':'s'} still missing.` : (patch.adult==='no' ? 'Saved. Members under 18 need a guardian form, so contact the team.' : m.approved ? 'Details saved. Next, sign the Vantedge NDA.' : 'Details saved. You can sign once the team approves you.'));
      }
    }
    if(f === 'sForm'){
      const m = S.me, err = $('#sErr');
      if(!$('#c1').checked || !$('#c2').checked){ err.textContent = 'Tick both boxes to confirm.'; return; }
      if(norm(val('typed')) !== norm(m.name)){ err.textContent = `Type your full name exactly as on your profile: ${m.name}.`; return; }
      if(strokes < 1){ err.textContent = 'Draw your signature in the box.'; return; }
      S.signing = true; const btn = $('#signBtn'); btn.disabled = true; btn.textContent = 'Signing…'; err.textContent = '';
      try{
        const signedAt = nowISO(), typedName = String(m.name).trim().replace(/\s+/g,' ');
        const portalSig = exportSig(), inkSig = exportSigInk();
        const bytes = await makeSignedPdf(m, inkSig, signedAt, typedName);
        const path = `${S.session.user.id}/vantedge-nda-${NDA_VERSION}-${Date.now()}.pdf`;
        const up = await sb.storage.from(NDA_BUCKET).upload(path, new Blob([bytes], {type:'application/pdf'}), { contentType:'application/pdf', upsert:false });
        if(up.error) throw up.error;
        const r = await sb.from('members').update({ signed_at:signedAt, signed_name:typedName, signature:portalSig, nda_version:NDA_VERSION, nda_path:path }).eq('id', m.id).select();
        if(r.error) throw r.error;
        S.signing = false; await loadAll(); window.scrollTo({top:0, behavior:'smooth'}); toast('Signed. Your library is unlocked, and your signed copy is saved.');
      }catch(x){ console.error(x); S.signing = false; const b = $('#signBtn'); if(b){ b.disabled = false; b.textContent = 'Sign NDA and unlock library'; } const er = $('#sErr'); if(er) er.textContent = friendly(x); }
    }
    if(f === 'addForm'){
      const name = val('n-name'), email = val('n-email').toLowerCase(), err = $('#addErr');
      if(!name){ err.textContent = 'Enter their full name.'; return; }
      if(!emailOk(email)){ err.textContent = 'Enter a valid email.'; return; }
      if(S.members.some(x=>String(x.email).toLowerCase()===email)){ err.textContent = 'A member with this email already exists.'; return; }
      $('#addBtn').disabled = true;
      const ok = await run(() => sb.from('members').insert({ name, email, vertical:$('#n-vertical').value, division:$('#n-division').value, role:$('#n-role').value, approved:true, approved_at:nowISO(), source:'admin' }).select());
      if(ok){ await loadAll(); addModal({email}); } else { const b=$('#addBtn'); if(b) b.disabled=false; }
    }
    if(f === 'editFileForm'){
      const id = MS.id, title = val('e-title');
      if(!title){ $('#efErr').textContent = 'Give the file a title.'; return; }
      const r = await sb.from('resources').update({ title, description:val('e-desc'), division:$('#e-div').value, allow_download:$('#e-dl').checked }).eq('id', id).select();
      if(r.error || !r.data || !r.data.length){ $('#efErr').textContent = friendly(r.error || 'permission'); return; }
      closeModal(); toast('File updated'); await loadAll();
    }
    if(f === 'upForm'){
      const file = $('#u-file').files[0], title = val('u-title'), err = $('#upErr');
      if(!file){ err.textContent = 'Choose a file to upload.'; return; }
      if(!title){ err.textContent = 'Give the file a title.'; return; }
      if(file.size > MAX_UPLOAD_MB*1024*1024){ err.textContent = `That file is ${fmtSize(file.size)}. The limit is ${MAX_UPLOAD_MB} MB. For long videos, compress them or split them into parts.`; return; }
      const division = $('#u-div').value, desc = val('u-desc'), allow = $('#u-dl').checked;
      const safe = file.name.replace(/[^A-Za-z0-9._-]+/g,'-').replace(/-+/g,'-');
      const folder = division.replace(/[^A-Za-z0-9]+/g,'-').toLowerCase();
      const path = `${folder}/${Date.now()}-${safe}`;
      S.uploading = true; render();
      await run(async () => {
        const up = await sb.storage.from(BUCKET).upload(path, file, { contentType:file.type || 'application/octet-stream', upsert:false });
        if(up.error) return up;
        const ins = await sb.from('resources').insert({ title, description:desc, division, file_path:path, file_name:file.name, file_type:file.type||'', file_size:file.size, allow_download:allow }).select();
        if(ins.error){ await sb.storage.from(BUCKET).remove([path]); }
        return ins;
      }, allow ? 'Uploaded. Active members can view and download it.' : 'Uploaded. Active members can view it.');
      S.uploading = false; await loadAll();
    }
  });

  /* ================= BOOT ================= */
  (async function boot(){
    let hashErr = null;
    if(location.hash && /error_description/.test(location.hash)){ const h = new URLSearchParams(location.hash.slice(1)); hashErr = h.get('error_description'); }
    const isRecovery = /type=recovery/.test(location.hash || '');
    try{ const { data } = await sb.auth.getSession(); S.session = data ? data.session : null; }catch(e){ S.session = null; }
    if(isRecovery && S.session) S.recovering = true;
    if(location.hash && /access_token|error/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
    S.booted = true;
    if(hashErr) setTimeout(()=>toast(/expired|invalid/i.test(hashErr) ? 'That email link has expired or was already used. If you were confirming your email, try logging in. Otherwise, request a new code.' : hashErr, true), 300);
    await afterAuth();
    sb.auth.onAuthStateChange((event, session) => {
      if(event === 'PASSWORD_RECOVERY'){ S.session = session; S.recovering = true; render(); return; }
      const was = S.session && S.session.user && S.session.user.id, now = session && session.user && session.user.id;
      S.session = session;
      if(was !== now) setTimeout(afterAuth, 0);
    });
  })();
})();
</script>

</body>
</html>
